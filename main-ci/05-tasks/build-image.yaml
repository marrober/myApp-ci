apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build
spec:
  params:
    - name: TLSVERIFY
      description: Verify the TLS on the registry endpoint
      type: string
      default: 'false'
    - name: STORAGE_DRIVER
      description: The Buildah storage STORAGE_DRIVER.
      type: string
    - name: intermediate-image
      type: string
    - name: path
      type: string
  workspaces:
    - name: files
      mountPath: /files
  steps:
    - name: ls
      command:
        - ls
        - -al
        - files/source/$(params.path)
      image: image-registry.openshift-image-registry.svc:5000/myapp-ci/buildah:latest
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      workingDir: /files/source
      resources: {}
    - name: build
      command:
        - buildah
        - bud
        - '--tls-verify=$(params.TLSVERIFY)'
        - '--storage-driver=$(params.STORAGE_DRIVER)'
        - '--root'
        - '/files/buildah-containers'
        - '--layers'
        - '-f'
        - /files/source/$(params.path)/dockerfile/build-src-dockerfile
        - '-t'
        - $(params.intermediate-image)
        - .
      image: image-registry.openshift-image-registry.svc:5000/myapp-ci/buildah:latest
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      workingDir: /files/source
      resources: {}
  
