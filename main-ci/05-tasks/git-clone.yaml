apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone
  annotations:
    tekton.dev/categories: Git
    tekton.dev/tags: git
    tekton.dev/displayName: "git clone"
spec:
  workspaces:
    - name: output
      description: Target workspace for the git repository.
  params:
    - name: url
      description: Repository URL to clone from.
      type: string
    - name: revision
      description: Revision to checkout. (branch, tag, sha, ref, etc...)
      type: string
      default: ""
    - name: subdirectory
      description: Subdirectory into which the repo will be cloned in the output workspace.
      type: string
      default: ""
    - name: verbose
      description: Log level.
      type: string
      default: "true"
    - name: image
      description: The image providing the git-init binary that this Task runs.
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/myapp-ci/git-init-rhel9:v1.19.2"
  results:
    - name: commit
      description: The precise commit SHA that was fetched by this Task.
    - name: url
      description: The precise URL that was fetched by this Task.
    - name: committer-date
      description: The epoch timestamp of the commit that was fetched by this Task.
  steps:
    - name: clone
      image: "$(params.image)"
      env:
      - name: PARAM_VERBOSE
        value: $(params.verbose)
      - name: PARAM_SUBDIRECTORY
        value: $(params.subdirectory)
      - name: WORKSPACE_OUTPUT_PATH
        value: $(workspaces.output.path)
      - name: PARAM_URL
        value: $(params.url)
      - name: PARAM_REVISION
        value: $(params.revision)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      script: |
        #!/usr/bin/env sh
        set -eu

        if [ "${PARAM_VERBOSE}" = "true" ] ; then
          set -x
        fi

        CHECKOUT_DIR="${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"

        mkdir -p "${CHECKOUT_DIR}"

        ls -al ${WORKSPACE_OUTPUT_PATH}

        git clone ${PARAM_URL} 

        cd ${REPO_NAME}

        git checkout ${PARAM_REVISION}

        ls -al 

        RESULT_SHA="$(git rev-parse HEAD)"
        EXIT_CODE="$?"
        if [ "${EXIT_CODE}" != 0 ] ; then
          exit "${EXIT_CODE}"
        fi
        RESULT_COMMITTER_DATE="$(git log -1 --pretty=%ct)"
        printf "%s" "${RESULT_COMMITTER_DATE}" > "$(results.committer-date.path)"
        printf "%s" "${RESULT_SHA}" > "$(results.commit.path)"
        printf "%s" "${PARAM_URL}" > "$(results.url.path)"