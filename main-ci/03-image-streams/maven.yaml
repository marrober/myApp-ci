kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: maven-build
  namespace: myapp-ci
spec:
  lookupPolicy:
    local: false
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: 'quay.io/marrober/maven-build:latest'
      importPolicy:
        importMode: Legacy
      referencePolicy:
        type: Source