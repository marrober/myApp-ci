kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: buildah
  namespace: myapp-ci
spec:
  lookupPolicy:
    local: false
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: 'registry.redhat.io/rhel8/buildah:latest'
      importPolicy:
        importMode: Legacy
      referencePolicy:
        type: Source